<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MvuaSmart USSD Simulator</title>
<style>
  :root {
    --bg: #eef1ee; --ink: #1d2420; --muted: #66706a;
    --body: #23272a; --bezel: #111416; --lcd: #c9d8b8; --lcd-ink: #17220f;
    --key: #3a4045; --key-ink: #f2f4f3; --call: #2f8f4e; --end: #c0392b;
    --dialog: #fbfcf9; --accent: #2f6f4e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #151917; --ink: #e6ebe7; --muted: #9aa49e; }
  }
  :root[data-theme="dark"] { --bg: #151917; --ink: #e6ebe7; --muted: #9aa49e; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
         font: 15px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
         display: flex; flex-direction: column; align-items: center; padding: 24px 16px; gap: 16px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .bar label { color: var(--muted); font-size: 13px; }
  .bar input { font: inherit; padding: 6px 8px; border: 1px solid #9aa49e; border-radius: 6px;
               width: 150px; background: transparent; color: var(--ink); }
  .bar button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #9aa49e;
                background: transparent; color: var(--ink); cursor: pointer; }
  .phone { width: 300px; max-width: 100%; background: var(--body); border-radius: 36px; padding: 22px 18px 26px;
           box-shadow: 0 18px 40px rgba(0,0,0,.35), inset 0 0 0 2px #000; }
  .speaker { width: 60px; height: 6px; border-radius: 3px; background: #0b0d0e; margin: 0 auto 14px; }
  .screen { background: var(--bezel); border-radius: 10px; padding: 8px; }
  .lcd { background: var(--lcd); color: var(--lcd-ink); border-radius: 4px; height: 290px;
         padding: 8px; display: flex; flex-direction: column; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .status { display: flex; justify-content: space-between; font-size: 11px; opacity: .75; margin-bottom: 6px; }
  .home { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; text-align: center; }
  .home .dialed { font-size: 22px; letter-spacing: 1px; min-height: 30px; word-break: break-all; }
  .home .hint { font-size: 11px; opacity: .7; }
  .dialog { flex: 1; display: none; flex-direction: column; background: var(--dialog); border-radius: 4px;
            padding: 8px; color: #111; box-shadow: 0 2px 0 rgba(0,0,0,.15); min-height: 0; }
  .dialog pre { margin: 0; flex: 1; overflow-y: auto; white-space: pre-wrap; font: inherit; }
  .dialog input { font: inherit; margin-top: 6px; padding: 5px; border: 1px solid #888; border-radius: 3px; width: 100%; }
  .dialog .actions { display: flex; justify-content: space-between; margin-top: 6px; }
  .dialog .actions button { font: inherit; border: none; background: none; color: var(--accent); font-weight: 700; cursor: pointer; padding: 2px 4px; }
  .busy { opacity: .6; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .keys button { font: 600 20px system-ui, sans-serif; color: var(--key-ink); background: var(--key);
                 border: none; border-radius: 14px; padding: 10px 0 8px; cursor: pointer; line-height: 1; }
  .keys button small { display: block; font-size: 9px; font-weight: 500; opacity: .6; margin-top: 3px; letter-spacing: 1px; }
  .keys button:active { filter: brightness(1.3); }
  .keys .call { background: var(--call); font-size: 15px; }
  .keys .end { background: var(--end); font-size: 15px; }
  .log { width: 300px; max-width: 100%; font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }
  .log div { white-space: pre-wrap; border-top: 1px solid rgba(128,128,128,.25); padding: 4px 0; }
</style>
</head>
<body>
  <div class="bar">
    <label for="phone">Phone</label><input id="phone" value="+254700000001" title="Simulator numbers are fake: +2547000xxxxx">
    <label for="code">Code</label><input id="code" value="*384*55#" style="width:100px">
    <button id="newnum" type="button" title="Use a fresh number to see the language prompt">New number</button>
  </div>

  <div class="phone">
    <div class="speaker"></div>
    <div class="screen"><div class="lcd">
      <div class="status"><span>Safaricom</span><span id="clock"></span></div>
      <div class="home" id="home">
        <div class="dialed" id="dialed"></div>
        <div class="hint">Dial the service code, then press Call</div>
      </div>
      <div class="dialog" id="dialog">
        <pre id="msg"></pre>
        <input id="reply" inputmode="numeric" autocomplete="off" aria-label="Reply">
        <div class="actions"><button id="cancel" type="button">Cancel</button><button id="send" type="button">Send</button></div>
      </div>
    </div></div>
    <div class="keys" id="keys"></div>
  </div>

  <div class="log" id="log"></div>

<script>
const $ = id => document.getElementById(id);
const keys = [["1",""],["2","ABC"],["3","DEF"],["4","GHI"],["5","JKL"],["6","MNO"],
              ["7","PQRS"],["8","TUV"],["9","WXYZ"],["*",""],["0","+"],["#",""]];
let session = null, path = "", open = false, dialed = "";

for (const [k, sub] of keys) {
  const b = document.createElement("button");
  b.type = "button"; b.innerHTML = `${k}<small>${sub || "&nbsp;"}</small>`;
  b.onclick = () => press(k);
  $("keys").append(b);
}
const call = Object.assign(document.createElement("button"), { type: "button", className: "call", textContent: "Call" });
const del = Object.assign(document.createElement("button"), { type: "button", textContent: "⌫" });
const hang = Object.assign(document.createElement("button"), { type: "button", className: "end", textContent: "End" });
call.onclick = () => open ? send() : dial();
del.onclick = () => open ? ($("reply").value = $("reply").value.slice(0, -1)) : setDialed(dialed.slice(0, -1));
hang.onclick = close;
$("keys").append(call, del, hang);

function press(k) {
  if (open) { $("reply").value += k; $("reply").focus(); }
  else setDialed(dialed + k);
}
function setDialed(v) { dialed = v; $("dialed").textContent = v; }
function tick() { $("clock").textContent = new Date().toTimeString().slice(0, 5); }
tick(); setInterval(tick, 30000);

function log(dir, text) {
  const d = document.createElement("div");
  d.textContent = `${dir} ${text}`;
  $("log").prepend(d);
}

async function hop(text) {
  $("dialog").classList.add("busy");
  const body = new URLSearchParams({ sessionId: session, phoneNumber: $("phone").value,
                                     serviceCode: $("code").value, text });
  log("→", `text="${text}"`);
  try {
    const r = await fetch("/simulator/ussd", { method: "POST", body });
    const t = await r.text();
    log("←", t);
    return t;
  } catch (e) {
    return "END Network error: " + e.message;
  } finally { $("dialog").classList.remove("busy"); }
}

function show(reply) {
  const ends = reply.startsWith("END");
  $("home").style.display = "none";
  $("dialog").style.display = "flex";
  $("msg").textContent = reply.replace(/^(CON|END) /, "");
  $("reply").style.display = ends ? "none" : "block";
  $("send").textContent = ends ? "OK" : "Send";
  open = !ends ? true : "ended";
  $("reply").value = "";
  if (!ends) $("reply").focus();
}

async function dial() {
  if (dialed !== $("code").value) { setDialed($("code").value); return; }
  session = Math.random().toString(36).slice(2, 10);
  path = "";
  show(await hop(""));
}

async function send() {
  if (open === "ended") return close();
  const v = $("reply").value.trim();
  if (!v) return;
  path = path ? `${path}*${v}` : v;
  show(await hop(path));
}

function close() {
  open = false; session = null; path = "";
  $("dialog").style.display = "none";
  $("home").style.display = "flex";
  setDialed("");
}

$("send").onclick = send;
$("cancel").onclick = close;
$("reply").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("newnum").onclick = () => {
  $("phone").value = "+2547000" + String(Math.floor(Math.random() * 1e5)).padStart(5, "0");
  close();
};
document.addEventListener("keydown", e => {
  if (open || e.target.tagName === "INPUT") return;
  if (/^[0-9*#]$/.test(e.key)) press(e.key);
  else if (e.key === "Enter") dial();
  else if (e.key === "Backspace") setDialed(dialed.slice(0, -1));
});
</script>
</body>
</html>
