# DrainSense on the Oracle VM (deployed by .github/workflows/ci.yml into /opt/drainsense).
#   drainsense-api   FastAPI: risk map, drainage log, flood-impact model (/api/v1, /docs, /openapi.json)
#   drainsense-web   Next.js desk (everything else)
# No host ports. Both join the network of the Caddy that NGAO's stack already runs on :80/:443,
# and that Caddy routes the DrainSense hostname to them (see drainsense.caddy, remote-deploy.sh).
# Service names are prefixed so they never answer for NGAO's own `api` on the shared network.
# Images are written to .env by the deploy.
name: drainsense

services:
  drainsense-api:
    image: ${DRAINSENSE_API_IMAGE:?DRAINSENSE_API_IMAGE is set by the deploy}
    environment:
      DRAINSENSE_DB: /data/drainsense.sqlite
    volumes:
      - api-data:/data
    restart: unless-stopped
    networks: [default, edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  drainsense-web:
    image: ${DRAINSENSE_WEB_IMAGE:?DRAINSENSE_WEB_IMAGE is set by the deploy}
    restart: unless-stopped
    networks: [default, edge]
    depends_on: [drainsense-api]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logging

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-ngao_default}

volumes:
  # SQLite drainage log: survives redeploys.
  api-data:
