name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API, model, and pytest
        run: pip install -r api/requirements.txt -r model/requirements.txt pytest==8.3.3
      - name: Pytest
        run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the web desk
        working-directory: web
        run: npm ci && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f api/Dockerfile -t drainsense-api .
