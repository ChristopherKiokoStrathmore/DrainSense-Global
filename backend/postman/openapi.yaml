          type: integer
          description: Wards with p >= 0.5
        medium:
          type: integer
          description: Wards with threshold <= p < 0.5
        low:
          type: integer
        probability_by_region:
          type: object
          additionalProperties:
            type: number
            format: double
        s1_act:
          type: integer
          description: S1 RISK_SCORES rows at ACT (alerted after approval)
        s1_watch:
          type: integer
        s1_alert_type:
          type: string
        model_card_rows:
          type: integer
        notes:
          type: array
          items:
            type: string
      required:
      - dry_run
      - season
      - source
      - status
    SeasonalSummaryStatusEnum:
      enum:
      - ISSUED
      - DRY_RUN
      - waiting_for_data
      type: string
      description: '* `ISSUED` - ISSUED

        * `DRY_RUN` - DRY_RUN

        * `waiting_for_data` - waiting_for_data'
    SendAlertsJobAccepted:
      type: object
      properties:
        job_id:
          type: integer
          description: Row in JOB_RUNS; see GET /jobs/{job_id}/status
        job:
          type: string
        status:
          type: string
          description: Always DONE
        summary:
          $ref: '#/components/schemas/SendAlertsSummary'
      required:
      - job
      - job_id
      - status
      - summary
    SendAlertsJobInRequest:
      type: object
      properties:
        as_of:
          type: string
          format: date
          description: 'Score date whose ACT rows are alerted. Default: today'
        dry_run:
          type: boolean
          default: false
          description: Render up to 5 previews, write nothing
        county:
          type: string
          minLength: 1
          maxLength: 60
    SendAlertsSummary:
      type: object
      properties:
        as_of:
          type: string
          format: date
        dry_run:
          type: boolean
        approval_required:
          type: boolean
        act_scores:
          type: integer
        alerts_created:
          type: integer
        pending_approval:
          type: integer
        messages_queued:
          type: integer
        suppressed_cooldown:
          type: integer
        suppressed_cap:
          type: integer
        already_drafted:
          type: integer
        no_subscribers:
          type: integer
        preview:
          type: array
          items:
            $ref: '#/components/schemas/AlertPreview'
          description: dry_run only
        approved_dispatch:
          $ref: '#/components/schemas/ApprovedDispatchSummary'
      required:
      - act_scores
      - alerts_created
      - already_drafted
      - approval_required
      - as_of
      - dry_run
      - messages_queued
      - no_subscribers
      - pending_approval
      - suppressed_cap
      - suppressed_cooldown
    ServiceEnum:
      enum:
      - FARM
      - HERD
      - HEALTH
      type: string
      description: '* `FARM` - FARM

        * `HERD` - HERD

        * `HEALTH` - HEALTH'
    SimulatedInbound:
      type: object
      properties:
        message_id:
          type: integer
        report:
          allOf:
          - $ref: '#/components/schemas/SimulatedReport'
          nullable: true
          description: null when the text was a keyword (STOP, LUGHA EN, 1, ...)
      required:
      - message_id
      - report
    SimulatedInboundRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          description: Sender, any Kenyan format
          maxLength: 20
        text:
          type: string
          minLength: 1
          description: The SMS text, exactly as the farmer would send it
          maxLength: 1000
      required:
      - phone
      - text
    SimulatedReport:
      type: object
      properties:
        report_id:
          type: integer
        report_type:
          type: string
        report_count:
          type: number
          format: double
          nullable: true
        review_status:
          $ref: '#/components/schemas/SimulatedReportReviewStatusEnum'
        ai_confidence:
          type: number
          format: double
          nullable: true
        source:
          $ref: '#/components/schemas/SourceEnum'
      required:
      - ai_confidence
      - report_count
      - report_id
      - report_type
      - review_status
      - source
    SimulatedReportReviewStatusEnum:
      enum:
      - AUTO_ACCEPTED
      - NEEDS_REVIEW
      type: string
      description: '* `AUTO_ACCEPTED` - AUTO_ACCEPTED

        * `NEEDS_REVIEW` - NEEDS_REVIEW'
    SmsBackendEnum:
      enum:
      - console
      - africastalking
      - wasiliana
      type: string
      description: '* `console` - console

        * `africastalking` - africastalking

        * `wasiliana` - wasiliana'
    SmsDispatchEnum:
      enum:
      - inline
      - worker
      type: string
      description: '* `inline` - inline

        * `worker` - worker'
    SmsSummary:
      type: object
      properties:
        sent:
          type: integer
        simulated:
          type: integer
          description: 'Synthetic subscribers: marked SENT, never sent'
        failed:
          type: integer
        retry_later:
          type: integer
      required:
      - failed
      - retry_later
      - sent
      - simulated
    SourceEnum:
      enum:
      - SMS_AI
      - SMS_KEYWORD
      type: string
      description: '* `SMS_AI` - SMS_AI

        * `SMS_KEYWORD` - SMS_KEYWORD'
    SpeciesEnum:
      enum:
      - cattle
      - goats
      - sheep
      - camels
      type: string
      description: '* `cattle` - cattle

        * `goats` - goats

        * `sheep` - sheep

        * `camels` - camels'
    TemplateSourceEnum:
      enum:
      - ALERT_TEMPLATE
      - ALERT_TYPES
      - DEFAULT
      type: string
      description: '* `ALERT_TEMPLATE` - ALERT_TEMPLATE

        * `ALERT_TYPES` - ALERT_TYPES

        * `DEFAULT` - DEFAULT'
    UnitEnum:
      enum:
      - bags
      - animals
      type: string
      description: '* `bags` - bags

        * `animals` - animals'
    Unsubscribed:
      type: object
      properties:
        status:
          type: string
          description: Always STOPPED
      required:
      - status
    WardItem:
      type: object
      properties:
        ward_id:
          type: integer
        ward_name:
          type: string
        county:
          type: string
        centroid:
          $ref: '#/components/schemas/Centroid'
      required:
      - centroid
      - county
      - ward_id
      - ward_name
    WardList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WardItem'
      required:
      - items
    WardRisk:
      type: object
      properties:
        ward_id:
          type: integer
        ward_name:
          type: string
        score_date:
          type: string
          format: date
        risks:
          type: array
          items:
            $ref: '#/components/schemas/RiskItem'
      required:
      - risks
      - score_date
      - ward_id
      - ward_name
    WardStatusLine:
      type: object
      properties:
        text:
          type: string
          description: One line for the USSD screen, in the subscriber's language
        registered:
          type: boolean
        ward_id:
          type: integer
          nullable: true
        decision:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/DecisionEnum'
          - $ref: '#/components/schemas/NullEnum'
        alert_type:
          type: string
          nullable: true
      required:
      - alert_type
      - decision
      - registered
      - text
      - ward_id
  securitySchemes:
    ApiToken:
      type: http
      scheme: bearer
      description: 'NGAO_API_TOKENS: APEX demo controls, scheduler, router, tests.'
    UssdToken:
      type: http
      scheme: bearer
      description: 'USSD_SERVICE_TOKEN: Louisa''s ussd/ service. Only /ussd/* endpoints.'
    WebhookSecret:
      type: apiKey
      in: query
      name: k
      description: WEBHOOK_SECRET appended to the Africa's Talking callback URLs. A wrong secret is ignored silently (still
        200).
servers:
- url: /ngao/v1
  description: Contract path (ORDS-style); what ussd/ calls
- url: /api/v1
  description: Django base path (same routes)
tags:
- name: Health & docs
  description: Liveness and configuration summary.
- name: Jobs
  description: §2.2 action endpoints for APEX demo controls and the scheduler. Each call runs synchronously, is recorded in
    `JOB_RUNS`, and answers `202` with a summary.
- name: Alerts
  description: Officer approval of drafted alerts. This is the same as the APEX Alert Approvals page, which may also set `ALERTS.status='APPROVED'`
    directly.
- name: Wards & risk
  description: '§2.3 reads: wards and today''s decisions per ward.'
- name: Reports
  description: §2.3 reads and officer review of farmer/herder reports (SMS replies and USSD menu 2).
- name: Dryer routes
  description: §2.3 tomorrow's dryer plan and booking confirmation.
- name: USSD contract
  description: §5 endpoints called by Louisa's `ussd/` service. Database only, no AI; well under 2 s.
- name: SMS webhooks
  description: §3 callbacks from Africa's Talking (form-encoded). They always answer `200` with an empty body. The parser
    lives in `sms/providers/africastalking.py`.
- name: Demo
  description: Helpers for the Friday demo.
- name: Public scorecard
  description: 'Unauthenticated: every alert graded in public.'
