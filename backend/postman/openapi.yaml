  /jobs/send-alerts:
    post:
      operationId: job_send_alerts
      description: 'For every `ACT` score of `as_of` (not replay, not A5) drafts **one `ALERTS` row per eligible subscriber**
        (ACTIVE, consented, role in the alert''s audience), which is what live `V_ALERT_QUEUE` can show. The body is rendered
        from `ALERT_TEMPLATE` (hazard, severity, lang) in that subscriber''s language and stored in at most 160 characters.


        - `ALERTS_REQUIRE_APPROVAL=true` (default): status `PENDING_APPROVAL`; an officer approves in APEX or via `POST /alerts/{alert_id}/approve`.

        - Otherwise: `APPROVED` by `auto` and fanned out at once.

        - A ward-level cooldown (`ALERT_TYPES.cooldown_hours`, 48 h) stops repeat drafts; reruns are idempotent (`already_drafted`).

        - Also fans out any alert already `APPROVED` in APEX (`approved_dispatch`).


        Answers `202` once the job has **finished** (`status: DONE`). The run is stored in `JOB_RUNS` when that table exists
        (see `GET /jobs/{job_id}/status`). The live database has no `JOB_RUNS` table; the job still runs and the status is
        kept for this process.'
