  /sms/delivery:
    post:
      operationId: sms_delivery_report
      description: 'Set as the **SMS delivery reports** callback in the Africa''s Talking dashboard: `https://<host>/ngao/v1/sms/delivery?k=<WEBHOOK_SECRET>`.
        Maps the report onto `MESSAGES.status` by `provider_msg_id` (the `messageId` returned at send): `Success` → `DELIVERED`,
        `Failed` / `Rejected` → `FAILED`; `Sent`, `Submitted`, `Buffered` are not final and change nothing.


        Form-encoded (JSON also accepted). **Always `200`, empty body**; every raw body is logged. Extra field names can be
        mapped with `SMS_DLR_FIELDS`.'
      summary: Delivery report callback (Africa's Talking)
      tags:
      - SMS webhooks
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeliveryReportBodyRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryReportBodyRequest'
            examples:
              Delivered:
                value:
                  id: ATXid_7b2f0e8f1c2d4a6b9e3f
                  status: Success
                  phoneNumber: '+254712345678'
                  networkCode: '63902'
                  retryCount: '0'
                summary: delivered
              Failed:
                value:
                  id: ATXid_7b2f0e8f1c2d4a6b9e3f
                  status: Failed
                  phoneNumber: '+254712345678'
                  networkCode: '63902'
                  failureReason: UserIsInactive
                  retryCount: '0'
                summary: failed
        required: true
      security:
      - WebhookSecret: []
      - {}
      responses:
        '200':
          description: Empty body, always
  /sms/inbound:
    post:
      operationId: sms_inbound
      description: 'Set as the **incoming messages** callback of your Africa''s Talking shortcode (sandbox shortcodes are
        free): `https://<host>/ngao/v1/sms/inbound?k=<WEBHOOK_SECRET>`. Stores `MESSAGES(direction=IN)` and answers `200`
        at once; processing runs in the background:


        1. **Keywords first** (no AI): `STOP`; `LUGHA SW|EN` / `LANG SW|EN`; `1` / `NDIYO` (confirm the open dryer booking,
        else NDIYO = harvested); `RVF [n] [species]`.

        2. Otherwise the **reply reader** (OCI GenAI with the §2.4 JSON schema, or the keyword + number fallback) writes `REPORTS`:
        `AUTO_ACCEPTED` when confident (≥ 0.7), else `NEEDS_REVIEW`.


        Form-encoded (JSON also accepted). **Always `200`, empty body.**'
      summary: Incoming SMS callback (Africa's Talking)
      tags:
      - SMS webhooks
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InboundSmsBodyRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/InboundSmsBodyRequest'
            examples:
              FarmerReply(Kiswahili):
                value:
                  from: '+254712345678'
                  to: '12345'
                  text: Nimevuna magunia 20, mvua imenyesha, mahindi yana unyevu
                  date: '2026-10-15 09:12:01'
                  id: 6f3c1a2b-9d84-4e1f
                  linkId: SampleLinkId123
                  networkCode: '63902'
                summary: farmer reply (Kiswahili)
              ChangeLanguage:
                value:
                  from: '+254712345678'
                  to: '12345'
                  text: LANG EN
                  id: a1b2c3
                summary: change language
              ConfirmBooking:
                value:
                  from: '+254712345678'
                  to: '12345'
                  text: '1'
                  id: a1b2c4
                summary: confirm booking
              OperatorDryingReport:
                value:
                  from: '+254700000901'
                  to: '12345'
                  text: Dried 120 bags, 13%
                  id: a1b2c5
                summary: operator drying report
        required: true
      security:
      - WebhookSecret: []
      - {}
      responses:
        '200':
          description: Empty body, always
