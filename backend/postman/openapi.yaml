components:
  schemas:
    AlertApproved:
      type: object
      properties:
        alert_id:
          type: integer
        status:
          $ref: '#/components/schemas/ApprovedAlertStatusEnum'
        dispatch:
          $ref: '#/components/schemas/DispatchResult'
      required:
      - alert_id
      - dispatch
      - status
    AlertList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertOut'
      required:
      - items
    AlertOut:
      type: object
      properties:
        alert_id:
          type: integer
          readOnly: true
        score_id:
          type: integer
          readOnly: true
        subscriber_id:
          type: integer
        phone:
          type: string
        alert_type_id:
          type: string
          readOnly: true
        ward_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
        ward_name:
          type: string
        county:
          type: string
        hazard:
          type: string
          nullable: true
          maxLength: 30
        severity:
          type: string
          nullable: true
          maxLength: 16
        lang:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/AlertOutLangEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        body:
          type: string
          nullable: true
          maxLength: 160
        status:
          type: string
          maxLength: 16
        probability:
          type: number
          format: double
        confidence_pct:
          type: integer
        score_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        approved_by:
          type: string
          nullable: true
          maxLength: 100
        approved_at:
          type: string
          format: date-time
          nullable: true
        sent_at:
          type: string
          format: date-time
          nullable: true
        messages:
          type: object
          additionalProperties:
            type: integer
          description: 'The SMS linked by ALERTS.MESSAGE_ID, e.g. {"SENT": 1}. Empty until queued.'
          readOnly: true
      required:
      - alert_id
      - alert_type_id
      - county
      - messages
      - phone
      - score_id
      - subscriber_id
      - ward_id
      - ward_name
    AlertOutLangEnum:
      enum:
      - sw
      - en
      type: string
      description: '* `sw` - Kiswahili

        * `en` - English'
    AlertPreview:
      type: object
      properties:
        ward:
          type: string
        alert_type:
          type: string
        lang:
          $ref: '#/components/schemas/LangEnum'
        body:
          type: string
        template_source:
          $ref: '#/components/schemas/TemplateSourceEnum'
      required:
      - alert_type
      - body
      - lang
      - template_source
      - ward
    AlertRejected:
      type: object
      properties:
        alert_id:
          type: integer
        status:
          type: string
          description: Always REJECTED
      required:
      - alert_id
      - status
    ApproveInRequest:
      type: object
      properties:
        approved_by:
          type: string
          minLength: 1
          default: api
          description: Officer name, stored in ALERTS.approved_by
          maxLength: 100
    ApprovedAlertStatusEnum:
      enum:
      - APPROVED
      - SENT
      type: string
      description: '* `APPROVED` - APPROVED

        * `SENT` - SENT'
    ApprovedDispatchSummary:
      type: object
      properties:
        alerts_dispatched:
          type: integer
        messages_queued:
          type: integer
        suppressed_cooldown:
          type: integer
        suppressed_cap:
          type: integer
        skipped_replay:
          type: integer
        skipped_stale:
          type: integer
      required:
      - alerts_dispatched
      - messages_queued
      - skipped_replay
      - skipped_stale
      - suppressed_cap
      - suppressed_cooldown
    BlankEnum:
      enum:
      - ''
    BookingConfirmed:
      type: object
      properties:
        booking_id:
          type: integer
        status:
          type: string
          description: Always CONFIRMED
      required:
      - booking_id
      - status
    BookingItem:
      type: object
      properties:
        booking_id:
          type: integer
        subscriber_id:
          type: integer
        bags:
          type: number
          format: double
          nullable: true
        fee_kes:
          type: number
          format: double
          nullable: true
          description: 'Total fee: bags x (moisture - 13) x KES 30'
        status:
          $ref: '#/components/schemas/BookingStatusEnum'
      required:
      - bags
      - booking_id
      - fee_kes
      - status
      - subscriber_id
    BookingStatusEnum:
      enum:
      - OFFERED
      - CONFIRMED
      - DRIED
      - NO_SHOW
      type: string
      description: '* `OFFERED` - OFFERED

        * `CONFIRMED` - CONFIRMED

        * `DRIED` - DRIED

        * `NO_SHOW` - NO_SHOW'
    CalibrationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CalibrationRow'
      required:
      - items
    CalibrationRow:
      type: object
      properties:
        alert_type:
          type: string
        prob_bin:
          type: number
          format: double
        predicted:
          type: number
          format: double
        observed:
          type: number
          format: double
        n:
          type: integer
      required:
      - alert_type
      - n
      - observed
      - predicted
      - prob_bin
    CategoryEnum:
      enum:
      - HIGH
      - MEDIUM
      - LOW
      type: string
      description: '* `HIGH` - HIGH

        * `MEDIUM` - MEDIUM

        * `LOW` - LOW'
    Centroid:
      type: object
      properties:
        lat:
          type: number
          format: double
          nullable: true
        lon:
          type: number
          format: double
          nullable: true
      required:
      - lat
      - lon
    CodeEnum:
      enum:
      - VALIDATION_ERROR
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - CONFLICT
      - UPSTREAM_ERROR
      - INTERNAL
      - METHOD_NOT_ALLOWED
      type: string
      description: '* `VALIDATION_ERROR` - VALIDATION_ERROR

        * `UNAUTHORIZED` - UNAUTHORIZED

        * `FORBIDDEN` - FORBIDDEN

        * `NOT_FOUND` - NOT_FOUND

        * `CONFLICT` - CONFLICT

        * `UPSTREAM_ERROR` - UPSTREAM_ERROR

        * `INTERNAL` - INTERNAL

        * `METHOD_NOT_ALLOWED` - METHOD_NOT_ALLOWED'
    DecisionEnum:
      enum:
      - ACT
      - WATCH
      - ABSTAIN
      type: string
      description: '* `ACT` - ACT

        * `WATCH` - WATCH

        * `ABSTAIN` - ABSTAIN'
    DeliveryReportBodyRequest:
      type: object
      description: Africa's Talking delivery report (form-encoded).
      properties:
        id:
          type: string
          minLength: 1
          description: messageId returned when the SMS was sent (MESSAGES.provider_msg_id)
        status:
          allOf:
          - $ref: '#/components/schemas/DeliveryReportBodyStatusEnum'
          description: 'Success = delivered to the handset; Failed/Rejected = FAILED


            * `Sent` - Sent

            * `Submitted` - Submitted

            * `Buffered` - Buffered

            * `Rejected` - Rejected

            * `Success` - Success

            * `Failed` - Failed'
        phoneNumber:
          type: string
          minLength: 1
        networkCode:
          type: string
          minLength: 1
          description: e.g. 63902 Safaricom
        failureReason:
          type: string
          description: e.g. InsufficientCredit, UserIsInactive, DeliveryFailure
        retryCount:
          type: string
          minLength: 1
      required:
      - id
      - status
    DeliveryReportBodyStatusEnum:
      enum:
      - Sent
      - Submitted
      - Buffered
      - Rejected
      - Success
      - Failed
      type: string
      description: '* `Sent` - Sent

        * `Submitted` - Submitted

        * `Buffered` - Buffered

        * `Rejected` - Rejected

        * `Success` - Success

        * `Failed` - Failed'
    DispatchJobAccepted:
      type: object
      properties:
        job_id:
          type: integer
          description: Row in JOB_RUNS; see GET /jobs/{job_id}/status
        job:
          type: string
        status:
          type: string
          description: Always DONE
        summary:
          $ref: '#/components/schemas/DispatchSummary'
      required:
      - job
      - job_id
      - status
      - summary
    DispatchJobInRequest:
      type: object
      properties:
        limit:
          type: integer
          maximum: 1000
          minimum: 1
          description: Max SMS this call
        retry_failed:
          type: boolean
          default: false
          description: Re-queue OUT messages that FAILED in the last 24 h
    DispatchResult:
      type: object
      properties:
        messages_queued:
          type: integer
        suppressed_cooldown:
          type: integer
        suppressed_cap:
          type: integer
        skipped:
          type: string
          description: 'replay | stale: the alert was not sent'
      required:
      - messages_queued
    DispatchSummary:
      type: object
      properties:
        approved_dispatch:
          $ref: '#/components/schemas/ApprovedDispatchSummary'
        sms:
          $ref: '#/components/schemas/SmsSummary'
      required:
      - approved_dispatch
      - sms
    DryingBooking:
      type: object
      properties:
        booking_id:
          type: integer
        status:
          $ref: '#/components/schemas/DryingBookingStatusEnum'
        point_name:
          type: string
        eta:
          type: string
          format: date-time
          nullable: true
        route_date:
          type: string
          format: date
        bags:
          type: integer
          nullable: true
        fee_kes:
          type: integer
          nullable: true
          description: Total drying fee for the booking (bags x fee per bag)
      required:
      - bags
      - booking_id
      - eta
      - fee_kes
      - point_name
      - route_date
      - status
    DryingBookingStatusEnum:
      enum:
      - OFFERED
      - CONFIRMED
      type: string
      description: '* `OFFERED` - OFFERED

        * `CONFIRMED` - CONFIRMED'
    DryingConfirmInRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          description: 'Kenyan mobile: +2547XXXXXXXX, 2547XXXXXXXX or 07XXXXXXXX (stored as E.164)'
        booking_id:
          type: integer
      required:
      - booking_id
      - phone
    DryingPoint:
      type: object
      properties:
        point_id:
          type: integer
        point_name:
          type: string
      required:
      - point_id
      - point_name
    DryingState:
      type: object
      properties:
        registered:
          type: boolean
        booking:
          allOf:
          - $ref: '#/components/schemas/DryingBooking'
          nullable: true
        points:
          type: array
          items:
            $ref: '#/components/schemas/DryingPoint'
      required:
      - booking
      - points
      - registered
    ErrorBody:
