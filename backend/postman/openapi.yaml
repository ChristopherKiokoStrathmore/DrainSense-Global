openapi: 3.0.3
info:
  title: Ngao · MvuaSmart backend API
  version: 1.0.0 (contract v1-draft.4)
  description: "\nBackend for **Ngao · MvuaSmart**: early warnings for floods, Rift Valley fever and aflatoxin,\nsent to farmers\
    \ and herders by SMS/USSD in Kiswahili or English (the subscriber's choice), with\nofficers approving alerts in the Oracle\
    \ APEX dashboard. This page is generated from the code and\nfollows [`docs/API_CONTRACT.md`](https://github.com/ChristopherKiokoStrathmore/MVUA-SMART/blob/main/docs/API_CONTRACT.md).\n\
    \n## Base URLs\nThe same API is served under two prefixes (pick one in **Servers** above):\n\n| Prefix | Who uses it |\n\
    |---|---|\n| `/ngao/v1` | the contract's ORDS-style path; Louisa's `ussd/` service, APEX demo controls |\n| `/api/v1`\
    \ | the contract's Django base URL; identical routes |\n\n## Authentication (§2.0)\nClick **Authorize** and paste a token\
    \ (without the word `Bearer`).\n\n| Scheme | Header | Caller | May call |\n|---|---|---|---|\n| `ApiToken` | `Authorization:\
    \ Bearer <NGAO_API_TOKENS>` | APEX demo controls, scheduler, tests | everything except the public endpoints |\n| `UssdToken`\
    \ | `Authorization: Bearer <USSD_SERVICE_TOKEN>` | Louisa's USSD service | `/ussd/*` only |\n| `WebhookSecret` | `?k=<WEBHOOK_SECRET>`\
    \ | Africa's Talking callbacks | `/sms/delivery`, `/sms/inbound` |\n| none | | anyone | `/health`, `/public/*`, these\
    \ docs |\n\n## Errors (§2.1)\nEvery error has the same body. `request_id` equals the `X-Request-ID` response header (send\
    \ your\nown `X-Request-ID` to correlate logs).\n```json\n{\"error\": {\"code\": \"VALIDATION_ERROR\", \"message\": \"\
    ward_id is required\",\n           \"details\": {\"field\": \"ward_id\"}, \"request_id\": \"8f2c...\"}}\n```\n| code |\
    \ HTTP |\n|---|---|\n| `VALIDATION_ERROR` | 400 |\n| `UNAUTHORIZED` | 401 |\n| `FORBIDDEN` | 403 |\n| `NOT_FOUND` | 404\
    \ |\n| `CONFLICT` | 409 |\n| `UPSTREAM_ERROR` | 502 |\n| `INTERNAL` | 500 |\n\nSMS webhooks are the exception: they **always**\
    \ answer `200` with an empty body.\n\n## Conventions\n- Phones are E.164 (`+2547XXXXXXXX`); inputs may also be `07…` or\
    \ `2547…`.\n- Times are ISO-8601 with the Nairobi offset (`2026-10-16T08:00:00+03:00`); dates are `YYYY-MM-DD` (EAT).\n\
    - `probability` is 0–1 and `confidence_pct` is 0–100. Decisions are `ACT` / `WATCH` / `ABSTAIN`.\n- Languages: `sw` (Kiswahili,\
    \ the default) or `en`.\n\n## The demo in seven calls\n1. `POST /ussd/language` + `POST /ussd/register`: the farmer registers\
    \ by USSD\n2. `POST /jobs/score`: score wards → `RISK_SCORES`\n3. `POST /jobs/send-alerts` → `GET /alerts?status=PENDING_APPROVAL`\
    \ → `POST /alerts/{id}/approve`: the SMS goes out\n4. `POST /demo/inbound-sms` (or Africa's Talking's `POST /sms/inbound`):\
    \ the farmer replies, *\"Nimevuna magunia 20…\"*\n5. `POST /jobs/plan-routes` → `GET /routes`: a dryer is routed to her\
    \ collection point\n6. `POST /bookings/{id}/confirm` (or an SMS reply of `1`): booking confirmed\n7. `POST /jobs/replay`:\
    \ the Garissa 2006 Rift Valley fever replay\n\nThe Postman collection in `backend/postman/` runs exactly this sequence.\n\
    \n## Safety rules the API enforces\n- Only `ACT` scores produce SMS, and only after approval (`ALERTS_REQUIRE_APPROVAL=true`).\n\
    - Replay alerts and approvals older than 48 h are never sent.\n- Synthetic subscribers (`is_demo='Y'`) never reach the\
    \ SMS provider.\n- Generative AI only *reads* replies. Unsure parses go to the officers' review queue.\n"
  contact:
    name: Dennis (backend-dennis)
  license:
    name: Hackathon prototype, GreenTech Hackathon 2026
paths:
  /alerts:
    get:
      operationId: alerts_list
      description: One row per subscriber (the live `ALERTS` shape). `messages` is the linked SMS, if queued.
      summary: List alerts
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Score date `YYYY-MM-DD`
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - sw
      - in: query
        name: limit
        schema:
          type: integer
        description: Max rows (default 200, at most 1000).
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPROVED
          - PENDING_APPROVAL
          - REJECTED
          - SENT
      - in: query
        name: ward_id
        schema:
          type: integer
      tags:
      - Alerts
      security:
      - ApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertList'
              examples:
                Pending:
                  value:
                    items:
                    - alert_id: 42
                      score_id: 1301
                      alert_type_id: A1
                      ward_id: 12
                      ward_name: Moiben
                      county: Uasin Gishu
                      hazard: dry_window
                      severity: warning
                      lang: sw
                      subscriber_id: 7
                      phone: '+254700000101'
                      body: 'MvuaSmart: Siku 3 za jua zinatarajiwa kuanzia Alhamisi katika kata yako (uhakika 75%). Vuna mahindi
                        sasa na uyakaushe. Jibu NDIYO ukivuna.'
                      status: PENDING_APPROVAL
                      probability: 0.75
                      confidence_pct: 75
                      score_date: '2026-10-15'
                      created_at: '2026-10-15T06:00:04+03:00'
                      approved_by: null
                      approved_at: null
                      sent_at: null
                      messages: {}
                  summary: pending
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATIONERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: ward_id is required
                      details:
                        field: ward_id
                      request_id: 8f2c4e0b9a7d4c1e
                  summary: VALIDATION_ERROR
          description: Validation error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    error:
                      code: UNAUTHORIZED
                      message: Authentication credentials were not provided.
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
          description: Missing or invalid bearer token
  /alerts/{alert_id}/approve:
    post:
      operationId: alert_approve
      description: '`PENDING_APPROVAL` → `APPROVED`, then queues the one SMS for this subscriber (48 h cooldown and 3/week
        routine cap; floods and disease skip the cap). `ALERTS.MESSAGE_ID` is set to that `MESSAGES` row. The alert becomes
        `SENT` once Africa''s Talking accepts the SMS. A subscriber who is no longer eligible is left `APPROVED` and not sent.
        Replay alerts and alerts older than 48 h are approved but **not** sent (`dispatch.skipped`).'
      summary: Approve an alert (sends it)
      parameters:
      - in: path
        name: alert_id
        schema:
          type: integer
        required: true
      tags:
      - Alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveInRequest'
            examples:
              Officer:
                value:
                  approved_by: agri.officer.uasingishu
                summary: officer
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApproveInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApproveInRequest'
      security:
      - ApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertApproved'
              examples:
                Approved:
                  value:
                    alert_id: 42
                    status: SENT
                    dispatch:
                      messages_queued: 1
                      suppressed_cooldown: 0
                      suppressed_cap: 0
                  summary: approved
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATIONERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: ward_id is required
                      details:
                        field: ward_id
                      request_id: 8f2c4e0b9a7d4c1e
                  summary: VALIDATION_ERROR
          description: Validation error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    error:
                      code: UNAUTHORIZED
                      message: Authentication credentials were not provided.
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
          description: Missing or invalid bearer token
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NOTFOUND:
                  value:
                    error:
                      code: NOT_FOUND
                      message: ward 999 not found
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
                  summary: NOT_FOUND
          description: Not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CONFLICT:
                  value:
                    error:
                      code: CONFLICT
                      message: alert 42 is SENT, not PENDING_APPROVAL
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
          description: Conflict with the current state
  /alerts/{alert_id}/reject:
    post:
      operationId: alert_reject
      description: '`PENDING_APPROVAL` → `REJECTED`. Nothing is sent. Rejected alerts do not block a later draft.'
      summary: Reject an alert
      parameters:
      - in: path
        name: alert_id
        schema:
          type: integer
        required: true
      tags:
      - Alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveInRequest'
            examples:
              Officer:
                value:
                  approved_by: agri.officer.uasingishu
                summary: officer
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApproveInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApproveInRequest'
      security:
      - ApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRejected'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATIONERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: ward_id is required
                      details:
                        field: ward_id
                      request_id: 8f2c4e0b9a7d4c1e
                  summary: VALIDATION_ERROR
          description: Validation error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    error:
                      code: UNAUTHORIZED
                      message: Authentication credentials were not provided.
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
          description: Missing or invalid bearer token
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NOTFOUND:
                  value:
                    error:
                      code: NOT_FOUND
                      message: ward 999 not found
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
                  summary: NOT_FOUND
          description: Not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CONFLICT:
                  value:
                    error:
                      code: CONFLICT
                      message: alert 42 is SENT, not PENDING_APPROVAL
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
          description: Conflict with the current state
  /bookings/{booking_id}/confirm:
    post:
      operationId: booking_confirm
      description: '`OFFERED` → `CONFIRMED` and a confirmation SMS in the farmer''s language. Same effect as the farmer replying
        `1`. Confirming twice is harmless; `409` for DRIED/NO_SHOW.'
      summary: Confirm a booking
      parameters:
      - in: path
        name: booking_id
        schema:
          type: integer
        required: true
      tags:
      - Dryer routes
      security:
      - ApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingConfirmed'
              examples:
                Contract:
                  value:
                    booking_id: 91
                    status: CONFIRMED
                  summary: contract
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    error:
                      code: UNAUTHORIZED
                      message: Authentication credentials were not provided.
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
          description: Missing or invalid bearer token
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NOTFOUND:
                  value:
                    error:
                      code: NOT_FOUND
                      message: ward 999 not found
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
                  summary: NOT_FOUND
          description: Not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CONFLICT:
                  value:
                    error:
                      code: CONFLICT
                      message: alert 42 is SENT, not PENDING_APPROVAL
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
          description: Conflict with the current state
  /demo/inbound-sms:
    post:
      operationId: demo_inbound_sms
      description: Runs exactly the `/sms/inbound` path (keywords, then the reply reader) **synchronously** and returns the
        resulting report. For the demo, and for testing without an Africa's Talking shortcode.
      summary: Simulate an inbound SMS
      tags:
      - Demo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatedInboundRequest'
            examples:
              DemoReply:
                value:
                  phone: '+254711000001'
                  text: Nimevuna magunia 20, mvua imenyesha, mahindi yana unyevu
                summary: demo reply
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SimulatedInboundRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SimulatedInboundRequest'
        required: true
      security:
      - ApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatedInbound'
              examples:
                Parsed:
                  value:
                    message_id: 311
                    report:
                      report_id: 78
                      report_type: wet_bags
                      report_count: 20
                      review_status: AUTO_ACCEPTED
                      ai_confidence: 0.8
                      source: SMS_KEYWORD
                  summary: parsed
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATIONERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: ward_id is required
                      details:
                        field: ward_id
                      request_id: 8f2c4e0b9a7d4c1e
                  summary: VALIDATION_ERROR
          description: Validation error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    error:
                      code: UNAUTHORIZED
                      message: Authentication credentials were not provided.
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
          description: Missing or invalid bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    error:
                      code: FORBIDDEN
                      message: This token may not call this endpoint
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
          description: Token not allowed here
  /health:
    get:
      operationId: health
      description: Checks the database connection and reports which SMS backend, dispatch mode and reply reader are active.
        `503` when the database is unreachable. Unauthenticated.
      summary: Liveness + configuration
      tags:
      - Health & docs
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                Ok:
                  value:
                    status: ok
                    database: oracle
                    sms_backend: africastalking
                    sms_dispatch: inline
                    reply_reader: genai
                    alerts_require_approval: true
                  summary: ok
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /jobs/{job_id}/status:
    get:
      operationId: job_status
      description: 'The recorded run for a job id returned by any `/jobs/*` call: params, summary, error text. Persisted in
        `JOB_RUNS` when that table exists; otherwise kept for this process only.'
      summary: One job run
      parameters:
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
      tags:
      - Jobs
      security:
      - ApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    error:
                      code: UNAUTHORIZED
                      message: Authentication credentials were not provided.
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
          description: Missing or invalid bearer token
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NOTFOUND:
                  value:
                    error:
                      code: NOT_FOUND
                      message: ward 999 not found
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
                  summary: NOT_FOUND
          description: Not found
  /jobs/dispatch:
    post:
      operationId: job_dispatch
      description: 'Fans out every `APPROVED` alert that has no messages yet (e.g. approved on the APEX page), then sends
        the `MESSAGES` queue through Africa''s Talking. The scheduler does this every 15 s anyway. Synthetic subscribers are
        marked `SENT` with `provider_msg_id=''SIMULATED''`.


        Answers `202` once the job has **finished** (`status: DONE`). The run is stored in `JOB_RUNS` when that table exists
        (see `GET /jobs/{job_id}/status`). The live database has no `JOB_RUNS` table; the job still runs and the status is
        kept for this process.'
      summary: Send approved alerts and queued SMS now
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchJobInRequest'
            examples:
              Now:
                value: {}
                summary: now
              RetryFailures:
                value:
                  retry_failed: true
                summary: retry failures
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DispatchJobInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DispatchJobInRequest'
      security:
      - ApiToken: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchJobAccepted'
              examples:
                Done:
                  value:
                    job_id: 1042
                    job: dispatch
                    status: DONE
                    summary:
                      approved_dispatch:
                        alerts_dispatched: 1
                        messages_queued: 3
                        suppressed_cooldown: 0
                        suppressed_cap: 0
                        skipped_replay: 0
                        skipped_stale: 0
                      sms:
                        sent: 1
                        simulated: 2
                        failed: 0
                        retry_later: 0
                  summary: done
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATIONERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: ward_id is required
                      details:
                        field: ward_id
                      request_id: 8f2c4e0b9a7d4c1e
                  summary: VALIDATION_ERROR
          description: Validation error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    error:
                      code: UNAUTHORIZED
                      message: Authentication credentials were not provided.
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
          description: Missing or invalid bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    error:
                      code: FORBIDDEN
                      message: This token may not call this endpoint
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
          description: Token not allowed here
  /jobs/grade-outcomes:
    post:
      operationId: job_grade_outcomes
      description: 'Grades ACT/WATCH scores whose window has passed against observed rain in `WARD_FEATURES_DAILY`: A1 hit
        = 3 consecutive days < 2 mm starting on day 1-5; A2 hit = a day > 20 mm on day 1-2. Scores without all observations
        wait (`waiting_for_data`).


        Answers `202` once the job has **finished** (`status: DONE`). The run is stored in `JOB_RUNS` when that table exists
        (see `GET /jobs/{job_id}/status`). The live database has no `JOB_RUNS` table; the job still runs and the status is
        kept for this process.'
      summary: Grade past alerts → OUTCOMES (scorecard)
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeJobInRequest'
            examples:
              Today:
                value: {}
                summary: today
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GradeJobInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GradeJobInRequest'
      security:
      - ApiToken: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeOutcomesJobAccepted'
              examples:
                Done:
                  value:
                    job_id: 1042
                    job: grade-outcomes
                    status: DONE
                    summary:
                      as_of: '2026-10-20'
                      graded: 3
                      hits: 2
                      misses: 1
                      waiting_for_data: 4
                  summary: done
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATIONERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: ward_id is required
                      details:
                        field: ward_id
                      request_id: 8f2c4e0b9a7d4c1e
                  summary: VALIDATION_ERROR
          description: Validation error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    error:
                      code: UNAUTHORIZED
                      message: Authentication credentials were not provided.
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
          description: Missing or invalid bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    error:
                      code: FORBIDDEN
                      message: This token may not call this endpoint
                      details: {}
                      request_id: 8f2c4e0b9a7d4c1e
          description: Token not allowed here
  /jobs/plan-routes:
    post:
      operationId: job_plan_routes
      description: 'Greedy dryer router (ARCHITECTURE §6.3):


        1. **Demand**: accepted `wet_bags` reports of the last 3 days, the latest per farmer, at the ward''s collection point.

        2. **Urgency**: wet bags × P(heavy rain 48 h, A2) × aflatoxin boost (A3 ACT 1.5, WATCH 1.2).

        3. **Capacity**: t/h × hours ÷ 0.09 bags per day; the most urgent point goes to the dryer with the most room; points
        are split across dryers when needed.

        4. **ETA**: 08:00 EAT + travel at 30 km/h + drying time, rounded up to 5 minutes.


        Creates `ROUTES`, `ROUTE_STOPS`, `BOOKINGS (OFFERED)` and queues the A5 booking SMS (`Jibu 1`) plus each operator''s
        stop list. `409` once any booking for that date is confirmed.


        Answers `202` once the job has **finished** (`status: DONE`). The run is stored in `JOB_RUNS` when that table exists
        (see `GET /jobs/{job_id}/status`). The live database has no `JOB_RUNS` table; the job still runs and the status is
        kept for this process.'
